services:
  postgres:
    image: postgres:16
    container_name: crm_agents_postgres
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_agents
    ports:
      - "5432:5432"
    volumes:
      - crm_agents_postgres_data:/var/lib/postgresql/data

volumes:
  crm_agents_postgres_data:
